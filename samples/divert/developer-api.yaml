---
# The developer's own copy of `api`, and nothing else.
#
# Deploy this into your own namespace. Note there is no frontend, no catalog and no
# inventory here: those stay shared, which is the entire point. `okteto divert up` mirrors
# them into this namespace as ExternalName services so this copy of `api` can still reach
# the rest of the chain.
#
# UPSTREAM is the bare name `catalog`, exactly as in the shared namespace. It resolves here
# through the mirror.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: hop
          image: ifbyol/divert-sample:1
          env:
            - name: NAME
              value: api-DEV
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: UPSTREAM
              value: http://catalog
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
